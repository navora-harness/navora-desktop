<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#15202b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <title>Navora</title>
    <style>
      #navora-startup { display: none; }
      html[data-navora-startup="loading"],
      html[data-navora-startup="loading"] body { background: transparent !important; }
      html[data-navora-startup="loading"] body > :not(#navora-startup) { opacity: 0 !important; pointer-events: none !important; }
      html[data-navora-startup="loading"] #navora-startup {
        position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
        background: color-mix(in srgb, var(--appearance-shell, #dce8f2) 32%, transparent);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        -webkit-app-region: drag;
      }
      #navora-startup img { width: 88px; height: 88px; object-fit: contain; user-select: none; -webkit-user-drag: none; animation: startup-breathe 1.8s ease-in-out infinite; }
      @keyframes startup-breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
      @media (prefers-color-scheme: dark) { html:not([data-navora-theme]) #navora-startup { --appearance-shell: #182736; } }
      @media (prefers-reduced-motion: reduce) { #navora-startup img { animation: none; } }
      @media (forced-colors: active), (prefers-reduced-transparency: reduce) {
        html[data-navora-startup="loading"] #navora-startup { background: Canvas; backdrop-filter: none; -webkit-backdrop-filter: none; }
      }
    </style>
    <script>
      if (window.navora?.app.startup?.active && !sessionStorage.getItem('navora-startup-complete')) {
        document.documentElement.dataset.navoraStartup = 'loading';
        document.addEventListener('DOMContentLoaded', async () => {
          document.body.inert = true;
          const icon = document.querySelector('#navora-startup img');
          try { await icon.decode(); } catch { /* The native window stays usable if an asset is missing. */ }
          requestAnimationFrame(() => requestAnimationFrame(() => {
            void window.navora.app.startup.shown();
          }));
        }, { once: true });
      }
    </script>
  </head>
  <body>
    <div id="navora-startup" role="status" aria-label="Navora 正在启动">
      <img src="/app-icon.png" alt="Navora" width="88" height="88" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
